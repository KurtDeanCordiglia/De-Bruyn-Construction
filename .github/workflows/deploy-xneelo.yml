name: Deploy to xneelo

# Runs every time changes are pushed to main, and can be run by hand from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the latest code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # xneelo only accepts SFTP on port 22. Secrets are cleaned of any spaces or
      # line breaks, which get added easily when pasting into GitHub's secret box.
      - name: Upload website to xneelo via SFTP
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          RAW_USERNAME: ${{ secrets.FTP_USERNAME }}
          RAW_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          FTP_SERVER=$(printf '%s' "$RAW_SERVER" | tr -d '[:space:]' | sed -e 's#^s\?ftps\?://##' -e 's#/.*$##' -e 's#:[0-9]*$##')
          FTP_USERNAME=$(printf '%s' "$RAW_USERNAME" | tr -d '[:space:]')
          export LFTP_PASSWORD=$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')
          echo "::add-mask::$FTP_SERVER"
          echo "::add-mask::$FTP_USERNAME"

          echo "Checking that xneelo answers on port 22..."
          if ! timeout 15 bash -c "</dev/tcp/$FTP_SERVER/22"; then
            echo "::error::Could not reach the server on port 22. Check the FTP_SERVER secret (e.g. ftp.debruyndevelopments.co.za or the xneelo server name)."
            exit 1
          fi
          echo "Port 22 is open."

          lftp <<EOF
          set cmd:fail-exit true
          set sftp:auto-confirm yes
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          open --env-password -u "$FTP_USERNAME" "sftp://$FTP_SERVER:22"
          cls -1 public_html/
          mirror --reverse --verbose --parallel=4 --exclude '(^|/)\.git' --exclude '^README\.md$' ./ public_html/
          bye
          EOF
